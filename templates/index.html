<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Machine Control Panel</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            height: 100vh;
            margin: 0;
            background-color: #2c3e50;
            color: white;
        }
        #telemetria-panel {
            width: 30%;
            padding: 20px;
            background-color: #34495e;
            box-shadow: 2px 0 5px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
        }
        #canvas-panel {
            width: 70%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #ecf0f1;
        }
        canvas {
            background-color: white;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            border: 1px solid #bdc3c7; 
        }
        .dato {
            font-size: 1.2em;
            margin-bottom: 15px;
            font-family: monospace;
        }
        .upload-section {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #7f8c8d;
        }
        button {
            margin-top: 10px;
            padding: 10px;
            background-color: #27ae60;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #2ecc71;
        }
    </style>
</head>
<body>

    <div id="telemetria-panel">
        <h2>Telemetry Data</h2>
        <hr>
        <div class="dato" id="queue-level">Queue Level: Waiting...</div>
        <div class="dato" id="val2">Right Angle (degrees): Waiting...</div>
        <div class="dato" id="val3">Left Angle (degrees): Waiting...</div>
        <div class="dato" id="val4">Pen State: Waiting...</div>

        <div class="upload-section">
            <h3>New Drawing</h3>
            <input type="file" id="image-upload" accept="image/*">
            <button onclick="caricaImmagine()">Send and Draw</button>
            <p id="upload-status" style="font-size: 0.9em; color: #f1c40f;"></p>
        </div>
    </div>

    <div id="canvas-panel">
        <canvas id="foglio" width="500" height="500"></canvas>
    </div>

    <script>
        const socket = io();
        const canvas = document.getElementById('foglio');
        const ctx = canvas.getContext('2d');
        
        // --- DISPLAY PARAMETERS ---
        const SCALA = 4; // Ridotta a 4 per far rientrare esattamente i 100mm nei 500px lasciando margine
        const CENTRO_X = canvas.width / 2; 
        
        // La Y minima fisica del robot definita in config.yaml
        const ROBOT_MIN_Y = 25; 
        
        // Altezza massima dell'area di disegno in millimetri (MAX_Y 125 - MIN_Y 25)
        const AREA_HEIGHT_MM = 90; 
        // ------------------------------------

        let lastX = null;
        let lastY = null;

        // 1. Listening to Telemetry data
        socket.on('Update telemetry', function(dati) {
            document.getElementById('queue-level').innerText = "Queue Level: " + dati[0];
            document.getElementById('val2').innerText = "Right Angle: " + dati[1] + "°";
            document.getElementById('val3').innerText = "Left Angle: " + dati[2] + "°";
            document.getElementById('val4').innerText = "Pen State: " + (dati[3] === 1 ? "Down" : "Up");
        });

        // 2. Listening to new points to draw
        socket.on('Update points', function(punto) {
            
            // COORDINATE TRANSLATION
            // Asse X: Inseriamo il "più" per assicurarci che i valori positivi vadano a destra
            const x = CENTRO_X + (punto.x * SCALA);
            
            const y_relativa = punto.y - ROBOT_MIN_Y; 
            const altezza_totale_canvas = AREA_HEIGHT_MM * SCALA;
            const margine_verticale = (canvas.height - altezza_totale_canvas) / 2;
            
            const y = canvas.height - margine_verticale - (y_relativa * SCALA);
            // ---------------------------------------------

            const state = punto.state;

            if (state === false) {
                lastX = x;
                lastY = y;
            } else {
                if (lastX !== null && lastY !== null) {
                    ctx.beginPath();
                    ctx.moveTo(lastX, lastY);
                    ctx.lineTo(x, y);
                    ctx.strokeStyle = '#2c3e50'; 
                    ctx.lineWidth = 2; 
                    ctx.stroke();
                }
                lastX = x;
                lastY = y;
            }
        });

        // 3. Clears the canvas before a new drawing
        socket.on('Clear canvas', function() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            document.getElementById('upload-status').innerText = "Drawing in progress...";
            lastX = null;
            lastY = null;
        });

        socket.on('Drawing complete', function() {
            document.getElementById('upload-status').innerText = "Drawing completed!";
        });

        // 4. Function to send the image to the Python server
        function caricaImmagine() {
            const fileInput = document.getElementById('image-upload');
            const file = fileInput.files[0];
            
            if (!file) {
                alert("Select an image before sending!");
                return;
            }

            document.getElementById('upload-status').innerText = "Processing...";
            
            const formData = new FormData();
            formData.append('file', file);

            fetch('/upload', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if(data.error) {
                    alert("Error: " + data.error);
                    document.getElementById('upload-status').innerText = "";
                } else {
                    console.log(data.message);
                }
            })
            .catch(error => {
                console.error("Network error:", error);
                document.getElementById('upload-status').innerText = "Connection error.";
            });
        }
    </script>
</body>
</html>
